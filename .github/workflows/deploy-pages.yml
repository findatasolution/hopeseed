name: Validate frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser configuration and scripts
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('config.js', 'utf8'), context);
          const config = context.window.HOPESEED_CONFIG;
          for (const key of ['STACK_PROJECT_ID', 'STACK_PUBLISHABLE_CLIENT_KEY', 'STACK_API_BASE', 'NEON_DATA_API']) {
            if (!config || !config[key]) throw new Error('Missing browser configuration: ' + key);
          }
          for (const file of ['index.html', 'about.html']) {
            const html = fs.readFileSync(file, 'utf8');
            for (const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)) {
              if (!match[0].includes('application/ld+json')) new Function(match[1]);
            }
          }
          console.log('Browser configuration and inline scripts validated.');
          JS
